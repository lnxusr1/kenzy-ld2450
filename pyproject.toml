[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kenzy-ld2450"
version = "0.1.0"
description = "In-node mmWave presence for Kenzy: an HLK-LD2450 radar on the node's UART"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # The plugin seam (API v1) ships in kenzy 5.1.0; the <6 cap is the promise
  # that a joint upgrade (or the load gate) revisits before a breaking core.
  "kenzy>=5.1.0,<6",
  "pyserial>=3.5",
]

[project.entry-points."kenzy.plugins.v1"]
ld2450 = "kenzy_ld2450"

[tool.setuptools]
packages = ["kenzy_ld2450"]

[tool.setuptools.package-data]
kenzy_ld2450 = ["panel/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Kenzy's exact selection — an EXPLICIT select, because an absent one means
# "whatever this ruff version's defaults are", which is a different linter on
# every machine (CI's newer ruff shipped G/BLE/S rules that fight the
# deliberate fail-closed except pattern; the local one didn't).
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
