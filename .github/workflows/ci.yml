name: CI

# The same gates the workstation runs (pytest / ruff / mypy strict), against
# the kenzy the plugin actually targets — the PUBLISHED one, since kenzy 5.1.0
# shipped the plugin seam. CI therefore proves the pairing a user installs,
# not a development snapshot. (Pre-5.1.0 this installed kenzy from git main
# out of necessity; if a future plugin change needs unreleased core, flip the
# install line back to `git+https://github.com/lnxusr1/kenzy.git` — and treat
# that as a reminder the plugin is ahead of a release.)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: ruff + mypy + pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        # server extra: the tests drive a real OccupancyTracker and the
        # integrations hub. dev extra: pytest-asyncio, ruff, mypy — the same
        # toolchain versions the core repo gates with.
        run: |
          pip install "kenzy[server,dev]"
          pip install -e . types-pyserial

      - name: ruff
        run: ruff check kenzy_ld2450/ tests/

      - name: mypy
        run: mypy kenzy_ld2450/

      - name: pytest
        run: pytest
